; Example optiwatchd configuration.
; Run with: optiwatchd -c etc/optiwatchd.conf

[daemon]
control_socket      = /tmp/optiwatchd.sock
event_log           = /tmp/optiwatchd-events.jsonl   ; "-" = stdout
poll_interval_ms    = 1000    ; diagnostics poll for ready ports
fast_poll_ms        = 100     ; poll while a module is coming up
insert_settle_ms    = 200     ; wait after insertion before touching the EEPROM
power_up_timeout_ms = 5000    ; CMIS ModulePwrUp -> ModuleReady limit
max_poll_errors     = 3       ; consecutive I2C failures before faulting the port
fault_retry_ms      = 5000    ; re-initialise a faulted port this often
hysteresis_temp_c   = 1.0     ; alarm clear margins
hysteresis_vcc_v    = 0.05
hysteresis_bias_ma  = 0.5
hysteresis_power_db = 0.5

; Simulator cages (start the simulator with: tools/optisim)
[port p0]
bus = sim:/tmp/optisim.sock:0

[port p1]
bus = sim:/tmp/optisim.sock:1
als = true                    ; automatic laser shutdown on Rx LOS

[port p2]
bus = sim:/tmp/optisim.sock:2

; Real hardware or the xcvr_i2c_emu kernel module:
; [port eth0]
; bus      = i2c:/dev/i2c-3
; max_xfer = 16               ; some host adapters limit transfer size
; retries  = 3
